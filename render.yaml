services:
  - type: web
    name: penrose-scholar
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: penrose-scholar-db
          property: connectionString
      - key: DATABASE_URL_SYNC
        fromDatabase:
          name: penrose-scholar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 8000

databases:
  - name: penrose-scholar-db
    plan: free
    databaseName: penrose_scholar
    ipAllowList: []
