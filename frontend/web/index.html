<html>
<head>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Penrose ScholarMW - AI-Powered Academic Intelligence & Learning Platform for Malawi">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ScholarMW">
  <meta name="theme-color" content="#0A0A14">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Penrose ScholarMW</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background: #0A0A14; }
    .loading { display: flex; justify-content: center; align-items: center; height: 100vh; color: white; font-family: sans-serif; }
    flutter-view, body { font-family: 'Noto Sans', 'Noto Sans SC', 'Noto Sans Arabic', sans-serif !important; }
  </style>
</head>
<body>
  <div class="loading">
    <div style="text-align:center">
      <div style="font-size:48px;margin-bottom:16px">&#127891;</div>
      <div style="font-size:20px;font-weight:bold">Penrose ScholarMW</div>
      <div style="font-size:14px;opacity:0.8;margin-top:8px">Loading...</div>
    </div>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
      caches.keys().then(function(cacheNames) {
        cacheNames.forEach(function(cacheName) {
          caches.delete(cacheName);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
