<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
    <title>Penrose ScholarMW — Biology Lab Molecular Viewer (Mol*)</title>
    <link rel="stylesheet" type="text/css" href="molstar.css" />
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1220; }
        #app { position: absolute; inset: 0; }
        #bio-load-error {
            display: none; position: absolute; inset: 0; z-index: 50;
            color: #e2e8f0; font: 13px/1.6 system-ui, sans-serif;
            padding: 24px; background: #0b1220; align-items: center; justify-content: center;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="bio-load-error"></div>
    <script type="text/javascript" src="./molstar.js"></script>
    <script type="text/javascript">
        // Penrose ScholarMW — offline-first molecular viewer.
        // Loads a LOCAL PDB file vendored in frontend/web/biology_lab/data/
        // (1BNA: B-DNA dodecamer; 1HHO: deoxyhemoglobin — RCSB PDB, free use).
        // No network call is made for structure data.
        (function () {
            function fail(msg) {
                var box = document.getElementById('bio-load-error');
                box.style.display = 'flex';
                box.textContent = msg;
                try {
                    window.parent && window.parent.postMessage({
                        source: 'penrose-bio-lab-molstar', type: 'error', message: msg
                    }, '*');
                } catch (e) { /* parent may not be same-origin */ }
            }

            var params = new URLSearchParams(window.location.search);
            var pdbUrl = params.get('pdb') || '../data/1bna.pdb';
            var label = params.get('label') || 'Molecular structure';

            if (typeof molstar === 'undefined' || !molstar.Viewer) {
                fail('Mol* library could not be loaded. Please reload the Biology Lab.');
                return;
            }

            molstar.Viewer.create('app', {
                layoutIsExpanded: false,
                layoutShowControls: true,
                layoutShowRemoteState: false,
                layoutShowSequence: true,
                layoutShowLog: false,
                layoutShowLeftPanel: true,
                viewportShowExpand: true,
                viewportShowSelectionMode: true,
                viewportShowAnimation: false,
                collapseOnPanelClick: false,
                backgroundColor: '0x0b1220'
            }).then(function (viewer) {
                try {
                    viewer.loadStructureFromUrl(pdbUrl, 'pdb', false, { label: label });
                    // Post a ready signal to the embedding Biology Lab engine.
                    try {
                        window.parent && window.parent.postMessage({
                            source: 'penrose-bio-lab-molstar', type: 'ready', url: pdbUrl
                        }, '*');
                    } catch (e) { /* non-fatal */ }
                } catch (err) {
                    fail('Could not load structure ' + pdbUrl + ': ' + err);
                }
            }, function (err) {
                fail('Mol* viewer failed to start: ' + err);
            });
        })();
    </script>
</body>
</html>
