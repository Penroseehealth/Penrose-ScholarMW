<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gram staining workflow</title>
<link rel="stylesheet" href="gram-stain.css">
</head>
<body>
<main>
<h1>Gram staining workflow</h1>
<p class="sub">Watch how the same smear splits into purple and pink bacteria.</p>

<div class="stage">
<svg viewBox="0 0 360 432" role="img" aria-label="Animated microscope slide with a frosted end, reagent bench with labelled bottles and a magnified field showing bacteria changing colour">
  <defs>
    <pattern id="frostp" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="var(--muted)" opacity=".55"/><circle cx="3" cy="3" r=".5" fill="var(--muted)" opacity=".35"/></pattern>
    <clipPath id="fc"><circle cx="180" cy="290" r="62"/></clipPath>
    <radialGradient id="vg" cx=".5" cy=".5" r=".5"><stop offset=".72" stop-color="#0a0514" stop-opacity="0"/><stop offset="1" stop-color="#0a0514" stop-opacity=".6"/></radialGradient>
    <radialGradient id="cg" cx=".36" cy=".34" r=".8"><stop offset="0" stop-color="#c9a6ef"/><stop offset=".5" stop-color="#4518c8"/><stop offset="1" stop-color="#1e0a5e"/></radialGradient>
    <linearGradient id="mt" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#7d838c"/><stop offset=".45" stop-color="#d8dce2"/><stop offset="1" stop-color="#6a7078"/></linearGradient>
    <linearGradient id="fyl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ff8f1f"/><stop offset=".55" stop-color="#ffd23d"/><stop offset="1" stop-color="#fff2a0" stop-opacity=".6"/></linearGradient>
    <linearGradient id="fbl" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4a7bff" stop-opacity=".9"/><stop offset=".6" stop-color="#9bc0ff" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf7a" stop-opacity=".25"/></linearGradient>
    <linearGradient id="fco" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1a3fd6"/><stop offset=".6" stop-color="#3b8cff"/><stop offset="1" stop-color="#bfe6ff"/></linearGradient>
    <radialGradient id="fglow"><stop offset="0" stop-color="#ffb347" stop-opacity=".5"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></radialGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f58fb5"/><stop offset=".5" stop-color="#d4337a"/><stop offset="1" stop-color="#8f1a4c"/></linearGradient>
    <clipPath id="smc"><ellipse id="smcl" cx="202" cy="143.4" rx="80" ry="22"/></clipPath>
    <clipPath id="bodyclip"><rect x="-15.5" y="-22" width="31" height="44" rx="6.5"/></clipPath>
    <clipPath id="gc"><rect x="103" y="90" width="244" height="100"/></clipPath>
    <filter id="fb1" x="-40%" y="-30%" width="180%" height="160%"><feGaussianBlur stdDeviation=".9"/></filter>
    <filter id="fb2" x="-40%" y="-30%" width="180%" height="160%"><feGaussianBlur stdDeviation=".5"/></filter>
    <filter id="fb3" x="-40%" y="-30%" width="180%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="bl2" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="bl"><feGaussianBlur stdDeviation="1.6"/></filter>
  </defs>
  <g id="bench"><rect x="0" y="70" width="360" height="11" rx="2" fill="var(--line)" stroke="var(--muted)"/><text x="6" y="92" font-size="8" fill="var(--muted)" font-family="Georgia,serif">reagent bench</text></g>
  <g id="bottles"></g>
  <g id="tap">
    <rect x="326" y="26" width="16" height="44" rx="3" fill="var(--line)" stroke="var(--muted)"/>
    <rect x="322" y="62" width="24" height="9" rx="2" fill="var(--muted)"/>
    <rect x="324" y="14" width="22" height="5" rx="2.5" fill="var(--muted)"/>
    <line x1="330" y1="30" x2="330" y2="58" stroke="#fff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
    <g id="armg" style="transform-origin:334px 28px;transform:scaleX(.2)"><rect x="208" y="24" width="130" height="8" rx="4" fill="var(--line)" stroke="var(--muted)"/></g>
    <g id="spoutg" style="transform:translateX(101px)">
      <rect x="203" y="23" width="10" height="10" rx="3" fill="var(--line)" stroke="var(--muted)"/>
      <rect x="204.5" y="31" width="7" height="44" rx="2" fill="var(--line)" stroke="var(--muted)"/>
      <rect x="203" y="74" width="10" height="10" rx="2" fill="var(--muted)"/>
    </g>
    <text x="334" y="92" text-anchor="middle" font-size="8" fill="var(--muted)" font-family="Georgia,serif">tap</text>
  </g>
    <g id="flame" style="opacity:0;transition:opacity .5s" transform="translate(202,226) scale(.82)">
    <rect x="-4.2" y="0" width="8.4" height="30" rx="1.5" fill="url(#mt)" stroke="var(--muted)" stroke-width=".6"/>
    <rect x="-5.8" y="13" width="11.6" height="6" rx="1.5" fill="#9aa0a8" stroke="var(--muted)" stroke-width=".6"/>
    <ellipse cx="0" cy="16" rx="2.2" ry="1.6" fill="#2a2d33"/>
    <path d="M-15 38Q-15 31 -8 30L8 30Q15 31 15 38Z" fill="url(#mt)" stroke="var(--muted)" stroke-width=".6"/>
    <path d="M12 35C30 35 34 40 52 40" stroke="var(--muted)" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <g id="fl" style="transform-origin:0px 0px"><circle cx="0" cy="-30" r="17" fill="url(#fglow)"/>
    <g id="fh" opacity=".32" filter="url(#fb3)">
      <path class="flt" style="animation-duration:.41s" d="M-10 0C-14 -10 -11 -22 -7 -34C-3 -26 -1 -18 -1 -10C2 -22 5 -34 8 -42C11 -30 14 -14 10 0Z" fill="#ff7a1a"/>
    </g>
    <g id="fy" filter="url(#fb1)">
      <path d="M-8 0C-11 -8 -8 -18 -4 -26L4 -26C8 -18 11 -8 8 0Z" fill="url(#fyl)"/>
      <path class="flt" style="animation-duration:.23s" d="M-6.5 -14C-9 -22 -6 -28 -5 -35C-3 -28 -1 -22 -1 -14Z" fill="url(#fyl)"/>
      <path class="flt" style="animation-duration:.31s" d="M-3.5 -16C-5 -26 -1 -34 0 -44C1 -34 5 -26 3.5 -16Z" fill="url(#fyl)"/>
      <path class="flt" style="animation-duration:.27s" d="M1 -14C1 -22 3 -26 5.6 -33C7.5 -26 9 -20 6.5 -14Z" fill="url(#fyl)"/>
    </g>
    <path id="fo" class="flk" style="animation-duration:.33s" d="M-4.6 0C-6.6 -7 -3.4 -16 0 -27C3.4 -16 6.6 -7 4.6 0Z" fill="url(#fbl)" filter="url(#fb2)" opacity="0"/>
    <path id="fc" class="flk" style="animation-duration:.23s" d="M-3.2 0C-4.2 -5 -2 -10 0 -15C2 -10 4.2 -5 3.2 0Z" fill="url(#fco)" filter="url(#fb2)" opacity="0"/></g>
  </g>
  <!-- slide: the uploaded photo (stain removed) with a masked, recolourable smear -->
  <g id="slideG" style="transform-origin:40px 135px"><image href="assets/slide.webp" x="10" y="96" width="340" height="92.6" preserveAspectRatio="none"/>
  <mask id="sm" maskUnits="userSpaceOnUse" x="10" y="96" width="340" height="92.6"><image href="assets/smear-mask.png" x="10" y="96" width="340" height="92.6" preserveAspectRatio="none"/></mask>
  <rect id="smearc" x="10" y="96" width="340" height="92.6" fill="rgba(135,130,125,.5)" mask="url(#sm)" style="transition:fill 2.6s ease"/><ellipse id="saline" cx="202" cy="143.4" rx="6" ry="2.4" fill="rgba(215,235,248,.35)" stroke="rgba(150,190,215,.8)" stroke-width="1" opacity="0" style="transition:opacity 2s ease"/><g id="wisps" opacity="0" style="transition:opacity 1.5s ease" fill="none" stroke="rgba(200,215,225,.75)" stroke-width="1.4" stroke-linecap="round"><path class="wsp" style="animation-delay:0s" d="M168 140q-5 -6 0 -12t0 -12"/><path class="wsp" style="animation-delay:.7s" d="M190 142q-5 -6 0 -12t0 -12"/><path class="wsp" style="animation-delay:1.3s" d="M212 140q-5 -6 0 -12t0 -12"/><path class="wsp" style="animation-delay:.4s" d="M234 142q-5 -6 0 -12t0 -12"/><path class="wsp" style="animation-delay:1.0s" d="M254 140q-5 -6 0 -12t0 -12"/></g>
  <g clip-path="url(#gc)"><ellipse id="residue" cx="212" cy="143.4" rx="104" ry="30" fill="#8e4fb8" opacity="0" filter="url(#bl2)" style="transition:opacity 1.2s ease"/><ellipse id="overlay" cx="212" cy="143.4" rx="108" ry="27" fill="#5b2a86" opacity="0" filter="url(#bl)"/><ellipse id="wfilm" cx="212" cy="143.4" rx="104" ry="27" fill="rgba(215,235,248,.28)" stroke="rgba(150,190,215,.75)" stroke-width="1" opacity="0" style="transition:opacity 1s ease,fill 2s ease"/><ellipse id="cvres" cx="165" cy="131" rx="40" ry="9" fill="#5b2ba6" opacity="0" filter="url(#bl2)" style="transition:opacity 1.2s ease"/><ellipse id="cvres2" cx="262" cy="153" rx="28" ry="6" fill="#5b2ba6" opacity="0" filter="url(#bl2)" style="transition:opacity 1.2s ease"/><ellipse id="sares" cx="238" cy="129" rx="30" ry="7" fill="#e0457b" opacity="0" filter="url(#bl2)" style="transition:opacity 1.2s ease"/><ellipse id="sares2" cx="152" cy="156" rx="18" ry="4.5" fill="#e0457b" opacity="0" filter="url(#bl2)" style="transition:opacity 1.2s ease"/></g>
  <ellipse id="viewring" cx="202" cy="143.4" rx="64" ry="23" fill="none" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="4 3" opacity="0" style="transition:opacity .8s"/></g>
  <g id="loop" opacity="0">
    <rect x="14" y="203.5" width="46" height="8" rx="4" fill="#2a2d33"/>
    <rect x="58" y="204.5" width="8" height="6" rx="1.5" fill="#9aa0a8" stroke="var(--muted)" stroke-width=".5"/>
    <line x1="66" y1="207.5" x2="198" y2="207.5" stroke="#8d939c" stroke-width="1.1" stroke-linecap="round"/>
    <ellipse id="lgl" cx="200" cy="207.5" rx="9" ry="9" fill="#ff9a2a" opacity="0" filter="url(#fb3)"/>
    <line id="lw2" x1="170" y1="207.5" x2="198" y2="207.5" stroke="#8d939c" stroke-width="1.3" stroke-linecap="round"/>
    <ellipse id="lp" cx="200.5" cy="207.5" rx="2.4" ry="3.6" fill="none" stroke="#8d939c" stroke-width="1.2"/>
    <ellipse id="lcul" cx="200.5" cy="207.5" rx="1.5" ry="2.8" fill="#e9dcc0" opacity="0"/>
  </g>
  <text id="adding" x="12" y="204" font-size="9.5" fill="var(--ink)" font-family="Georgia,serif"></text>
  <text id="slideLabel" x="348" y="203" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Georgia,serif">Slide MNH-0427</text>
  <g id="drops"></g>
  <g id="stream" opacity="0" style="transition:opacity .3s"><path d="M208 84V173" stroke="rgba(170,210,235,.5)" stroke-width="4.5" stroke-linecap="round"/><path d="M207 86V171" stroke="#fff" stroke-opacity=".9" stroke-width="1.4" stroke-dasharray="6 8" stroke-linecap="round" class="flow"/></g>
  <g id="runoff"></g>
  <rect x="256" y="300" width="100" height="9" rx="3" fill="var(--line)"/><rect id="trayliq" x="258" y="301.5" width="96" height="5" rx="2.5" fill="#6a2fa0" opacity="0" style="transition:opacity .8s ease,fill .8s ease"/>
  <text x="306" y="322" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Georgia,serif">waste tray</text>
  <g id="pour" opacity="0" style="transition:opacity .5s">
    <path class="pc" d="M333 231Q345 244 349 299" fill="none" stroke-width="5" stroke-linecap="round" stroke="rgba(150,190,215,.5)"/>
    <path class="pc" d="M268 226V299" fill="none" stroke-width="4.5" stroke-linecap="round" stroke="rgba(150,190,215,.5)"/>
    <path class="pc" d="M286 229V299" fill="none" stroke-width="4.5" stroke-linecap="round" stroke="rgba(150,190,215,.5)"/>
    <path class="pc" d="M304 232V299" fill="none" stroke-width="4.5" stroke-linecap="round" stroke="rgba(150,190,215,.5)"/>
    <path class="flow" d="M333 231Q345 244 349 299" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2" stroke-dasharray="6 8" stroke-linecap="round"/>
    <path class="flow" d="M268 226V299" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2" stroke-dasharray="6 8" stroke-linecap="round"/>
    <path class="flow" d="M286 229V299" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2" stroke-dasharray="6 8" stroke-linecap="round"/>
    <path class="flow" d="M304 232V299" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1.2" stroke-dasharray="6 8" stroke-linecap="round"/>
  </g>
  <path d="M202 190 L135 285 M202 190 L225 285" stroke="var(--line)" stroke-dasharray="3 4" fill="none"/>
  <g transform="translate(0,40)"><g id="fieldG" style="transform-origin:180px 290px;transition:transform 1.4s ease"><circle cx="180" cy="290" r="64" fill="var(--field)" stroke="var(--muted)" stroke-width="3"/>
  <g clip-path="url(#fc)"><g id="cells"></g><g id="real" style="opacity:0;transition:opacity 1.2s ease"><image id="realPhoto" href="assets/field-micrograph.webp" x="116" y="226" width="128" height="128" preserveAspectRatio="xMidYMid slice" style="opacity:0;transition:opacity 1.2s ease"/><g id="realV" style="opacity:0"></g></g></g>
  <circle id="vig" cx="180" cy="290" r="64" fill="url(#vg)" opacity="0" style="transition:opacity 1.2s ease"/></g>
  <text id="fieldLabel" x="180" y="386" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Georgia,serif">Microscope field</text></g>
</svg>
</div>

<div class="legend" id="legend">
  <span><i style="background:#3b1a66"></i>Gram-positive (cocci)</span>
  <span><i style="background:#e0457b"></i>Gram-negative (rods)</span>
</div>

<div class="info" aria-live="polite"><h2 id="title"></h2><p id="desc"></p><p class="t" id="time"></p></div>
<div class="bar" aria-hidden="true"><i id="bar"></i></div>
<div class="steps" id="steps"></div>
<div class="ctl">
  <button id="prev">Back</button>
  <button id="play" class="p">Play</button>
  <button id="next">Next</button>
  <select id="speed" aria-label="Animation speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
</div>
</main>

<script src="gram-stain.js"></script>
</body>
</html>
