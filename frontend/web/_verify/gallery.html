<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Biology lab verification shots</title>
<style>
  body { background:#14171a; color:#e8e8e8; font:14px/1.5 system-ui, sans-serif; margin:0; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  h2 { font-size:15px; margin:20px 0 8px; color:#c6d0d8; }
  p  { margin:0 0 12px; color:#9aa4ad; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  figure { margin:0; background:#1d2126; border:1px solid #2c333a; border-radius:8px; overflow:hidden; }
  figcaption { padding:7px 10px; font-weight:600; }
  img { display:block; width:100%; height:auto; }
  figure.wide { grid-column:1 / -1; }
</style>
</head>
<body>
<h1>Biology lab — verification captures (crops)</h1>
<p>Cutaway render (764×429) cropped and upscaled 3× — coat rails, curtains, drawers.</p>
<div class="grid">
  <figure class="wide"><figcaption>Cutaway — LEFT wall: windows + coat rails between them</figcaption><img src="cut_left.png" alt="left wall crop"></figure>
  <figure class="wide"><figcaption>Cutaway — RIGHT side (wall shell hidden; rail/coats seen from behind)</figcaption><img src="cut_right.png" alt="right wall crop"></figure>
  <figure class="wide"><figcaption>Cutaway — front whiteboard wall</figcaption><img src="cut_front.png" alt="front wall crop"></figure>
</div>
<h2>Full views</h2>
<div class="grid">
  <figure class="wide"><figcaption>view=wall — left wall from outside (windows, curtains)</figcaption><img src="shot_wall.png" alt="wall view"></figure>
  <figure><figcaption>view=cutaway — bird's eye</figcaption><img src="shot_cutaway.png" alt="cutaway view"></figure>
  <figure><figcaption>view=overview — default angle</figcaption><img src="shot_overview.png" alt="overview view"></figure>
  <figure><figcaption>view=aisle — benches: drawers, stools</figcaption><img src="shot_aisle.png" alt="aisle view"></figure>
  <figure><figcaption>view=aisle + drawers=open</figcaption><img src="shot_aisle_open.png" alt="aisle drawers open"></figure>
</div>
</body>
</html>
