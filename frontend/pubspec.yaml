name: penrose_scholar
description: Penrose ScholarMW - AI-Powered Academic Intelligence & Learning Platform for Malawi
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  go_router: ^14.6.2
  flutter_dotenv: ^5.2.1
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  intl: ^0.19.0
  shimmer: ^3.0.0
